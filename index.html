<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal do Cliente</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F7F5F2;
    --surface: #FFFFFF;
    --surface2: #F0EDE8;
    --border: #E2DDD7;
    --text: #1A1714;
    --text-soft: #7A7269;
    --accent: #8B6F47;
    --accent-light: #F0E8DC;
    --green: #4A7C59;
    --green-bg: #EAF2ED;
    --yellow: #8B7340;
    --yellow-bg: #F5F0E4;
    --red: #8B4A4A;
    --red-bg: #F5EAEA;
    --blue: #4A5F8B;
    --blue-bg: #EAEEf5;
    --radius: 12px;
    --shadow: 0 2px 16px rgba(26,23,20,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ---- LOADING ---- */
  #loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; z-index: 100;
    transition: opacity 0.4s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  .loader-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px; font-weight: 300;
    color: var(--accent); letter-spacing: 4px;
  }
  .loader-bar {
    width: 120px; height: 2px;
    background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .loader-bar-inner {
    height: 100%; width: 0; background: var(--accent);
    animation: load 1.8s ease forwards;
  }
  @keyframes load { to { width: 100%; } }

  /* ---- ERROR ---- */
  #error-screen {
    display: none; position: fixed; inset: 0;
    background: var(--bg);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; text-align: center; padding: 32px;
  }
  #error-screen.show { display: flex; }
  #error-screen h2 { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--accent); }
  #error-screen p { color: var(--text-soft); font-size: 15px; max-width: 320px; line-height: 1.6; }

  /* ---- HEADER ---- */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 400;
    color: var(--accent); letter-spacing: 2px;
  }
  .header-client { font-size: 13px; color: var(--text-soft); text-align: right; }
  .header-client strong { display: block; font-size: 15px; color: var(--text); font-weight: 500; margin-bottom: 2px; }

  /* ---- TABS ---- */
  .tabs {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; overflow-x: auto; padding: 0 24px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 14px 20px; font-size: 13px; font-weight: 500;
    color: var(--text-soft); cursor: pointer; white-space: nowrap;
    border-bottom: 2px solid transparent; transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ---- CONTENT ---- */
  #app { display: none; }
  #app.show { display: block; }
  .tab-content { display: none; padding: 24px; max-width: 720px; margin: 0 auto; }
  .tab-content.active { display: block; }

  /* ---- CARDS ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px; font-weight: 500;
    color: var(--text); margin-bottom: 16px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }

  /* ---- OVERVIEW GRID ---- */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .info-item label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-soft); display: block; margin-bottom: 4px;
  }
  .info-item span { font-size: 15px; font-weight: 500; color: var(--text); }

  /* ---- PROGRESS ---- */
  .progress-wrap { margin: 4px 0 8px; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text-soft); margin-bottom: 6px;
  }
  .progress-bar {
    height: 6px; background: var(--surface2);
    border-radius: 3px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    border-radius: 3px; transition: width 0.8s ease;
  }

  /* ---- ETAPAS TIMELINE ---- */
  .timeline { position: relative; padding-left: 28px; }
  .timeline::before {
    content: ''; position: absolute; left: 9px; top: 8px; bottom: 8px;
    width: 1px; background: var(--border);
  }
  .timeline-item {
    position: relative; margin-bottom: 20px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .timeline-item:last-child { margin-bottom: 0; }
  .timeline-dot {
    position: absolute; left: -23px; top: 4px;
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--border); background: var(--surface);
    z-index: 1;
  }
  .timeline-dot.concluido { background: var(--green); border-color: var(--green); }
  .timeline-dot.andamento { background: var(--accent); border-color: var(--accent); }
  .timeline-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .timeline-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .timeline-meta span { font-size: 12px; color: var(--text-soft); }

  /* ---- SUBITENS ---- */
  .subitem-group-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-soft); margin: 16px 0 8px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .subitem-list { display: flex; flex-direction: column; gap: 8px; }
  .subitem {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    background: var(--surface2); border-radius: 8px;
    font-size: 13px;
  }
  .subitem span { color: var(--text); }

  /* ---- BADGES ---- */
  .badge {
    font-size: 11px; font-weight: 500; padding: 3px 10px;
    border-radius: 20px; letter-spacing: 0.3px; white-space: nowrap;
  }
  .badge.concluido   { background: var(--green-bg);  color: var(--green);  }
  .badge.em-andamento{ background: var(--yellow-bg); color: var(--yellow); }
  .badge.andamento   { background: var(--yellow-bg); color: var(--yellow); }
  .badge.pendente    { background: var(--surface2);  color: var(--text-soft); }
  .badge.em-atraso   { background: var(--red-bg);    color: var(--red);    }
  .badge.atraso      { background: var(--red-bg);    color: var(--red);    }
  .badge.confirmado  { background: var(--green-bg);  color: var(--green);  }
  .badge.aprovado    { background: var(--green-bg);  color: var(--green);  }
  .badge.aberto      { background: var(--blue-bg);   color: var(--blue);   }
  .badge.analise     { background: var(--yellow-bg); color: var(--yellow); }

  /* ---- FINANCEIRO ---- */
  .fin-summary {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; margin-bottom: 20px;
  }
  .fin-box {
    background: var(--surface2); border-radius: 10px;
    padding: 14px 16px; text-align: center;
  }
  .fin-box label {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-soft);
    display: block; margin-bottom: 6px;
  }
  .fin-box .value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 600; color: var(--text);
  }
  .fin-box .value.hidden-val {
    letter-spacing: 4px; color: var(--text-soft); font-size: 18px;
  }

  /* ---- EYE BUTTON ---- */
  .eye-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-soft); padding: 4px;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-family: 'DM Sans', sans-serif;
    transition: color 0.2s;
  }
  .eye-btn:hover { color: var(--accent); }
  .eye-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ---- PARCELAS TABLE ---- */
  .parc-table { width: 100%; border-collapse: collapse; }
  .parc-table th {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-soft); font-weight: 500;
    text-align: left; padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  .parc-table td {
    font-size: 13px; padding: 12px 10px;
    border-bottom: 1px solid var(--surface2);
    vertical-align: middle;
  }
  .parc-table tr:last-child td { border-bottom: none; }
  .parc-table .valor-cell { font-weight: 500; }

  /* ---- ARQUIVOS ---- */
  .file-group-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-soft); margin: 16px 0 8px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .file-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--surface2);
  }
  .file-item:last-child { border-bottom: none; }
  .file-icon {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--accent-light); display: flex;
    align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; color: var(--accent);
    flex-shrink: 0; letter-spacing: 0.5px;
  }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 12px; color: var(--text-soft); }
  .file-link {
    font-size: 12px; color: var(--accent); text-decoration: none;
    font-weight: 500; white-space: nowrap;
    padding: 6px 12px; border-radius: 6px;
    background: var(--accent-light); transition: background 0.2s;
    flex-shrink: 0;
  }
  .file-link:hover { background: #E5D9C9; }

  /* ---- RESPONSIVE ---- */
  @media (max-width: 500px) {
    .info-grid { grid-template-columns: 1fr; }
    .fin-summary { grid-template-columns: 1fr; }
    header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .header-client { text-align: left; }
    .tab-content { padding: 16px; }
    .card { padding: 16px 18px; }
    .fin-box .value { font-size: 18px; }
  }
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="loader-logo">PORTAL</div>
  <div class="loader-bar"><div class="loader-bar-inner"></div></div>
</div>

<!-- ERROR -->
<div id="error-screen">
  <h2>Ops.</h2>
  <p id="error-msg">Não foi possível carregar os dados. Verifique o link recebido.</p>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-brand">HEITOR INTERIORES</div>
    <div class="header-client">
      <strong id="h-nome"></strong>
      <span id="h-proposta"></span>
    </div>
  </header>

  <nav class="tabs">
    <div class="tab active" data-tab="visao">Visão Geral</div>
    <div class="tab" data-tab="etapas">Etapas</div>
    <div class="tab" data-tab="financeiro">Financeiro</div>
    <div class="tab" data-tab="arquivos">Arquivos</div>
  </nav>

  <!-- VISÃO GERAL -->
  <div class="tab-content active" id="tab-visao">
    <div class="card">
      <div class="card-title">Projeto</div>
      <div class="info-grid" id="vg-info"></div>
    </div>
    <div class="card">
      <div class="card-title">Progresso das Etapas</div>
      <div id="vg-etapas-prog"></div>
    </div>
    <div class="card">
      <div class="card-title">
        Resumo Financeiro
        <button class="eye-btn" id="eye-vg-btn" onclick="toggleFinanceiro()">
          <svg id="eye-vg-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <span id="eye-vg-lbl">Ver valores</span>
        </button>
      </div>
      <div class="fin-summary" id="vg-fin"></div>
    </div>
  </div>

  <!-- ETAPAS -->
  <div class="tab-content" id="tab-etapas">
    <div class="card">
      <div class="card-title">Linha do Tempo</div>
      <div class="timeline" id="et-timeline"></div>
    </div>
    <div class="card">
      <div class="card-title">Subitens</div>
      <div id="et-subitens"></div>
    </div>
  </div>

  <!-- FINANCEIRO -->
  <div class="tab-content" id="tab-financeiro">
    <div class="card">
      <div class="card-title">
        Resumo
        <button class="eye-btn" id="eye-fin-btn" onclick="toggleFinanceiro()">
          <svg id="eye-fin-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <span id="eye-fin-lbl">Ver valores</span>
        </button>
      </div>
      <div class="fin-summary" id="fin-summary"></div>
      <div id="fin-formas" style="font-size:13px;color:var(--text-soft);margin-top:4px;"></div>
    </div>
    <div class="card">
      <div class="card-title">Parcelas</div>
      <table class="parc-table">
        <thead>
          <tr>
            <th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="fin-parcelas"></tbody>
      </table>
    </div>
  </div>

  <!-- ARQUIVOS -->
  <div class="tab-content" id="tab-arquivos">
    <div class="card">
      <div class="card-title">Documentos e Arquivos</div>
      <div id="arq-list"></div>
    </div>
  </div>
</div>

<script>
// =====================================================
// SUBSTITUA PELA URL DO SEU GOOGLE APPS SCRIPT
// =====================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyfpVGY_-_0ez2hV4yzqbn9b9c9f05UkE0rg7y5ORxgBtmNe7_8moDHx_VTgkXgnfCD/exec';

// =====================================================
let finVisible = false;
let globalData = null;

// Formata número como moeda brasileira
function fmt(v) {
  const n = parseFloat(String(v).replace(',', '.'));
  if (isNaN(n)) return v || '—';
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
}

// Gera badge de status — funciona com qualquer texto
function badge(status) {
  if (!status) return '';
  const raw = String(status).trim();
  const cls = raw.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove acentos
    .replace(/\s+/g, '-');
  return `<span class="badge ${cls}">${raw}</span>`;
}

// SVG olho aberto
function svgOpen() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
  </svg>`;
}
// SVG olho fechado
function svgClosed() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94
    M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19
    m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
    <line x1="1" y1="1" x2="23" y2="23"/>
  </svg>`;
}

function toggleFinanceiro() {
  finVisible = !finVisible;
  renderFinanceiro();
}

function renderFinanceiro() {
  if (!globalData) return;
  const { financeiro, parcelas } = globalData;

  const totalNum = parseFloat(String(financeiro.total).replace(',', '.')) || 0;
  const pagoNum  = parseFloat(String(financeiro.pago).replace(',', '.'))  || 0;
  const restante = totalNum - pagoNum;

  // Atualiza botões olhinho
  ['vg', 'fin'].forEach(id => {
    const svgEl = document.getElementById(`eye-${id}-svg`);
    const lblEl = document.getElementById(`eye-${id}-lbl`);
    if (svgEl) svgEl.outerHTML = `<span id="eye-${id}-svg" style="display:flex;width:16px;height:16px">${finVisible ? svgOpen() : svgClosed()}</span>`;
    if (lblEl) lblEl.textContent = finVisible ? 'Ocultar valores' : 'Ver valores';
  });

  // Bloco de valor — esconde ou mostra
  const val = (v) => finVisible
    ? `<div class="value">${v}</div>`
    : `<div class="value hidden-val">• • •</div>`;

  const sumHtml = `
    <div class="fin-box"><label>Total do Projeto</label>${val(fmt(totalNum))}</div>
    <div class="fin-box"><label>Total Pago</label>${val(fmt(pagoNum))}</div>
    <div class="fin-box"><label>Saldo Restante</label>${val(fmt(restante))}</div>
  `;
  ['vg-fin', 'fin-summary'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = sumHtml;
  });

  // Tabela de parcelas — quantidade dinâmica
  const tbody = document.getElementById('fin-parcelas');
  if (tbody) {
    if (parcelas.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="color:var(--text-soft);font-size:13px;padding:16px 10px;">Nenhuma parcela cadastrada.</td></tr>';
    } else {
      tbody.innerHTML = parcelas.map(p => `
        <tr>
          <td>${p.nome}</td>
          <td>${p.vencimento}</td>
          <td class="valor-cell">${finVisible ? fmt(p.valor) : '<span style="letter-spacing:3px;color:var(--text-soft)">• • •</span>'}</td>
          <td>${badge(p.status)}</td>
        </tr>
      `).join('');
    }
  }
}

function render(data) {
  globalData = data;
  const { basicos, statusEtapas, etapas, subitens, financeiro, parcelas, arquivos } = data;

  // --- HEADER ---
  document.getElementById('h-nome').textContent = basicos.nomeCliente || '—';
  document.getElementById('h-proposta').textContent =
    `Proposta #${basicos.numeroProposta} · ${basicos.tipoProjeto}`;

  // --- VISÃO GERAL: info ---
  document.getElementById('vg-info').innerHTML = `
    <div class="info-item"><label>Etapa Atual</label><span>${basicos.etapaAtual || '—'}</span></div>
    <div class="info-item"><label>Em Andamento</label><span>${basicos.subitEmAndamento || '—'}</span></div>
    <div class="info-item"><label>Previsão da Etapa</label><span>${basicos.previsaoEtapa || '—'}</span></div>
    <div class="info-item"><label>Tipo de Projeto</label><span>${basicos.tipoProjeto || '—'}</span></div>
  `;

  // --- VISÃO GERAL: progresso dinâmico ---
  // Conta quantas etapas existem e quantas estão concluídas
  const total = statusEtapas.length;
  const concluidas = statusEtapas.filter(s =>
    s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'') === 'concluido'
  ).length;
  const pct = total > 0 ? Math.round((concluidas / total) * 100) : 0;
  document.getElementById('vg-etapas-prog').innerHTML = `
    <div class="progress-wrap">
      <div class="progress-label">
        <span>${concluidas} de ${total} etapa${total !== 1 ? 's' : ''} concluída${concluidas !== 1 ? 's' : ''}</span>
        <span>${pct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
  `;

  // --- FINANCEIRO (renderiza oculto) ---
  renderFinanceiro();
  const finFormas = document.getElementById('fin-formas');
  if (finFormas && financeiro.formas) {
    finFormas.textContent = `Forma de pagamento: ${financeiro.formas}`;
  }

  // --- ETAPAS: timeline dinâmica ---
  if (etapas.length === 0) {
    document.getElementById('et-timeline').innerHTML =
      '<p style="color:var(--text-soft);font-size:13px;">Nenhuma etapa cadastrada.</p>';
  } else {
    document.getElementById('et-timeline').innerHTML = etapas.map((e, i) => {
      const s = (statusEtapas[i] || 'pendente').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const dotClass = s === 'concluido' ? 'concluido'
        : (s === 'em andamento' || s === 'andamento') ? 'andamento' : '';
      return `
        <div class="timeline-item">
          <div class="timeline-dot ${dotClass}"></div>
          <div class="timeline-name">${e.nome}</div>
          <div class="timeline-meta">
            <span>Prazo: ${e.prazo || '—'}</span>
            <span>${e.data || '—'}</span>
            ${badge(statusEtapas[i] || 'pendente')}
          </div>
        </div>`;
    }).join('');
  }

  // --- SUBITENS: agrupados dinamicamente ---
  const subEl = document.getElementById('et-subitens');
  if (subitens.length === 0) {
    subEl.innerHTML = '<p style="color:var(--text-soft);font-size:13px;">Nenhum subitem cadastrado.</p>';
  } else {
    // Agrupa por campo "grupo"
    const grupos = {};
    subitens.forEach(s => {
      const g = s.grupo || '';
      if (!grupos[g]) grupos[g] = [];
      grupos[g].push(s);
    });
    let html = '';
    for (const [grp, items] of Object.entries(grupos)) {
      if (grp) html += `<div class="subitem-group-title">${grp}</div>`;
      html += `<div class="subitem-list">`;
      items.forEach(s => {
        html += `<div class="subitem"><span>${s.nome}</span>${badge(s.status)}</div>`;
      });
      html += `</div>`;
    }
    subEl.innerHTML = html;
  }

  // --- ARQUIVOS: agrupados por pasta, quantidade dinâmica ---
  const arqEl = document.getElementById('arq-list');
  if (arquivos.length === 0) {
    arqEl.innerHTML = '<p style="color:var(--text-soft);font-size:13px;">Nenhum arquivo cadastrado.</p>';
  } else {
    const grupos = {};
    arquivos.forEach(a => {
      const g = a.pasta || 'Geral';
      if (!grupos[g]) grupos[g] = [];
      grupos[g].push(a);
    });
    let html = '';
    for (const [pasta, items] of Object.entries(grupos)) {
      html += `<div class="file-group-title">${pasta}</div>`;
      items.forEach(a => {
        html += `
          <div class="file-item">
            <div class="file-icon">${(a.tipo || 'ARQ').toUpperCase()}</div>
            <div class="file-info">
              <div class="file-name">${a.nome || '—'}</div>
              <div class="file-meta">${[a.data, a.statusArq].filter(Boolean).join(' · ')}</div>
            </div>
            ${a.link ? `<a class="file-link" href="${a.link}" target="_blank" rel="noopener">Abrir</a>` : ''}
          </div>`;
      });
    }
    arqEl.innerHTML = html;
  }
}

// ---- TABS ----
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// ---- INIT ----
function showError(msg) {
  document.getElementById('loading').classList.add('hide');
  const err = document.getElementById('error-screen');
  err.classList.add('show');
  if (msg) document.getElementById('error-msg').textContent = msg;
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('c');
  if (!code) {
    showError('Nenhum código de cliente informado. Verifique o link recebido.');
    return;
  }
  try {
    const res = await fetch(`${SCRIPT_URL}?c=${encodeURIComponent(code)}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) { showError(data.error); return; }
    render(data);
    setTimeout(() => {
      document.getElementById('loading').classList.add('hide');
      document.getElementById('app').classList.add('show');
    }, 1800);
  } catch (e) {
    showError('Não foi possível carregar os dados. Verifique sua conexão ou tente mais tarde.');
    console.error(e);
  }
}

init();
</script>
